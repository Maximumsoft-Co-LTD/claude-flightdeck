# Build the marketing/usage site and deploy it to GitHub Pages.
#
# > Why this exists (CLAUDE.md rule 7): the site is GENERATED from the repo's
# > own sources of truth (CHANGELOG.md, docs/research/INDEX.md, core agents &
# > skills) by site/generate.py. Running that generator in CI on every push to
# > main means the published pages can never drift from the template.
# >
# > Security note: this is committed, executable CI config (see
# > core/docs/setup/agent-config-security.md). It is deliberately minimal —
# > read-only `contents`, the standard first-party Pages actions, no secrets,
# > and it only runs our own dependency-free Python generator.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "CHANGELOG.md"
      - "docs/research/INDEX.md"
      - "core/.claude/agents/**"
      - "core/.claude/skills/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; don't cancel an in-flight publish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Generate static site
        run: python3 site/generate.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
