name: ai-workflow-validation

on:
  pull_request:
    branches: [main, dev]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: No unrendered placeholders remain
        run: |
          set -e
          MATCHES=$(grep -rEn '\{\{[A-Z_][A-Z0-9_]*\}\}' \
                      --include='*.md' --include='*.yml' --include='*.yaml' \
                      --include='*.json' --include='*.sh' --include='*.toml' \
                      --exclude-dir=node_modules --exclude-dir=.git \
                      --exclude='*.tmpl' . || true)
          if [ -n "$MATCHES" ]; then
            echo "Unrendered placeholders found (run the installer or render templates):"
            echo "$MATCHES"
            exit 1
          fi

      - name: Every .claude/agents/*.md has YAML frontmatter with name + description
        run: |
          set -e
          if [ -d .claude/agents ]; then
            for f in .claude/agents/*.md; do
              [ -f "$f" ] || continue
              head -n 30 "$f" | grep -qE '^name:[[:space:]]+\S' \
                || { echo "$f: missing 'name:' in frontmatter"; exit 1; }
              head -n 30 "$f" | grep -qE '^description:[[:space:]]+\S' \
                || { echo "$f: missing 'description:' in frontmatter"; exit 1; }
            done
          fi

      - name: Every .claude/skills/*/SKILL.md has name + description + Token budget heading
        run: |
          set -e
          if [ -d .claude/skills ]; then
            for f in .claude/skills/*/SKILL.md; do
              [ -f "$f" ] || continue
              head -n 30 "$f" | grep -qE '^name:[[:space:]]+\S' \
                || { echo "$f: missing 'name:' in frontmatter"; exit 1; }
              head -n 30 "$f" | grep -qE '^description:[[:space:]]+\S' \
                || { echo "$f: missing 'description:' in frontmatter"; exit 1; }
              grep -qE '^##[[:space:]]+Token budget' "$f" \
                || { echo "$f: missing '## Token budget' heading"; exit 1; }
            done
          fi

      - name: Backlog hygiene — Status enum + size cap (scripts/backlog.sh check)
        # Status drift is the #1 reason /work re-picks shipped work. scripts/backlog.sh
        # check enforces the enum mechanically: every ## Active row's Status is exactly
        # `open` or `wip S<N>` — which catches BOTH drift directions (terminal rows left
        # in Active AND mislabeled blobs like `verified`/`discovery`/done-buried-mid-cell)
        # — plus a HARD size cap so the hot file can't grow back to the 316KB failure.
        # Rationale + the hot/cold split: docs/setup/index-discipline.md.
        run: |
          set -e
          if [ -f scripts/backlog.sh ] && [ -f docs/project/backlog.md ]; then
            bash scripts/backlog.sh check
            # Advisory: surface wip rows that look already-closed in their sprint
            # (never fails the build — the B###→task link is heuristic).
            bash scripts/backlog.sh reconcile || true
          fi
          # Advisory: also flag follow-up Open rows that reached a terminal status.
          if [ -f docs/project/backlog.md ]; then
            LEAK=$(awk '/^### Open/{a=1;next} /^### |^## /{a=0} a' docs/project/backlog.md \
                     | grep -E '^\|[[:space:]]*F[0-9]' \
                     | grep -iE 'consumed-by|wont-?do|won.t do' || true)
            if [ -n "$LEAK" ]; then
              echo "::warning file=docs/project/backlog.md::Follow-up rows with a terminal status are still under '### Open' — move them to '### Closed':"
              echo "$LEAK"
            fi
          fi
